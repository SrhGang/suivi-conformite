# Déploiement sur une VM : Caddy (HTTPS) + API + PostgreSQL.
#   cp .env.example .env && ops/secrets.sh generate   # ou : sudo ops/secrets.sh systemd-creds
#   docker compose up -d --build
# Les mots de passe et la clé applicative sont des secrets Docker (fichiers
# montés dans /run/secrets), jamais des variables d'environnement.
name: conformite

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: conformite
      POSTGRES_USER: conformite_owner
      POSTGRES_PASSWORD_FILE: /run/secrets/owner_db_password
    secrets: [owner_db_password, app_db_password]
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./ops/db-init.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U conformite_owner -d conformite']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  api:
    build: { context: ., target: api }
    image: conformite-api:latest
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://conformite_app@db:5432/conformite
      DATABASE_PASSWORD_FILE: /run/secrets/app_db_password
      DATABASE_ADMIN_URL: postgres://conformite_owner@db:5432/conformite
      DATABASE_ADMIN_PASSWORD_FILE: /run/secrets/owner_db_password
      APP_SECRET_FILE: /run/secrets/app_secret
      PUBLIC_ORIGIN: https://${DOMAIN:?à définir dans .env}
      ORG_NAME: ${ORG_NAME:-Mon organisme}
      ORG_SECTOR: ${ORG_SECTOR:-}
      TOTP_ISSUER: ${TOTP_ISSUER:-Conformité ISO 27001}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      COOKIE_SECURE: 'true'
      TRUST_PROXY: 'true'
    secrets: [app_db_password, owner_db_password, app_secret]
    volumes:
      - uploads:/data/uploads
    networks: [internal]

  web:
    build: { context: ., target: web }
    image: conformite-web:latest
    restart: unless-stopped
    depends_on: [api]
    # BIND_ADDRESS : adresse d'écoute sur la VM (par ex. l'IP Tailscale 100.x.y.z
    # pour n'exposer l'application que sur le tailnet).
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:80:80'
      - '${BIND_ADDRESS:-0.0.0.0}:443:443'
      - '${BIND_ADDRESS:-0.0.0.0}:443:443/udp'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

# Fichiers générés par ops/secrets.sh (./secrets) ou déchiffrés par systemd-creds (/run/conformite).
secrets:
  owner_db_password:
    file: ${SECRETS_DIR:-./secrets}/owner_db_password
  app_db_password:
    file: ${SECRETS_DIR:-./secrets}/app_db_password
  app_secret:
    file: ${SECRETS_DIR:-./secrets}/app_secret

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:

networks:
  internal:
